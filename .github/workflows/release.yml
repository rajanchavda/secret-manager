name: Release macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app

      - name: Extract Version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Run Tests
        run: |
          swift test

      - name: Build Universal 2 Application & DMG
        run: |
          ./scripts/build-release-dmg.sh --version "${{ steps.version.outputs.version }}" --arch universal

      - name: Extract Checksum
        id: checksum
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256=$(awk '{print $1}' "build/Secret-Manager-${VERSION}.dmg.sha256")
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "SHA256 Checksum: $SHA256"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Secret Manager ${{ steps.version.outputs.tag }}"
          files: |
            build/Secret-Manager-${{ steps.version.outputs.version }}.dmg
            build/Secret-Manager-${{ steps.version.outputs.version }}.dmg.sha256
            build/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish Homebrew Cask Info to Summary
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 🍺 Homebrew Cask Release Information
          
          **Version**: `${{ steps.version.outputs.version }}`  
          **SHA256**: `${{ steps.checksum.outputs.sha256 }}`  
          **Download URL**: `https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/Secret-Manager-${{ steps.version.outputs.version }}.dmg`
          
          ### Updated Cask Formula (`Casks/secret-manager.rb`)
          ```ruby
          cask "secret-manager" do
            version "${{ steps.version.outputs.version }}"
            sha256 "${{ steps.checksum.outputs.sha256 }}"

            url "https://github.com/${{ github.repository }}/releases/download/v#{version}/Secret-Manager-#{version}.dmg"
            name "Secret Manager"
            desc "Hardware-grade Touch ID Secret Manager and stealth secret injection"
            homepage "https://github.com/${{ github.repository }}"

            app "Secret Manager.app"
            binary "#{appdir}/Secret Manager.app/Contents/MacOS/sec", target: "sec"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-cr", "#{appdir}/Secret Manager.app"],
                             sudo: false
            end

            zap trash: [
              "~/.sec",
              "~/Library/Application Support/Secret Manager",
              "~/Library/Preferences/com.sec.SecretManager.plist",
            ]
          end
          ```
          EOF
