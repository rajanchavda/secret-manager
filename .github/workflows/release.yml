name: Release macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app

      - name: Extract Version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Run Tests
        run: |
          swift test

      - name: Build Universal 2 Application & DMG
        run: |
          ./scripts/build-release-dmg.sh --version "${{ steps.version.outputs.version }}" --arch universal

      - name: Extract Checksum
        id: checksum
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256=$(awk '{print $1}' "build/Secret-Manager-${VERSION}.dmg.sha256")
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "SHA256 Checksum: $SHA256"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Secret Manager ${{ steps.version.outputs.tag }}"
          files: |
            build/Secret-Manager-${{ steps.version.outputs.version }}.dmg
            build/Secret-Manager-${{ steps.version.outputs.version }}.dmg.sha256
            build/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ Error: HOMEBREW_TAP_TOKEN is not configured in this repository's Secrets!"
            echo "👉 Go to: https://github.com/rajanchavda/security-manager/settings/secrets/actions and add HOMEBREW_TAP_TOKEN"
            exit 1
          fi

          git clone "https://x-access-token:${GH_TOKEN}@github.com/rajanchavda/homebrew-tap.git" /tmp/homebrew-tap

          ruby -e "
            version = ENV['VERSION']
            sha256  = ENV['SHA256']
            File.write('/tmp/homebrew-tap/Casks/secret-manager.rb', <<~CASK)
              cask \"secret-manager\" do
                version \"#{version}\"
                sha256 \"#{sha256}\"

                url \"https://github.com/rajanchavda/security-manager/releases/download/v\#{version}/Secret-Manager-\#{version}.dmg\"
                name \"Secret Manager\"
                desc \"Hardware-grade Touch ID Secret Manager and stealth secret injection\"
                homepage \"https://github.com/rajanchavda/security-manager\"

                app \"Secret Manager.app\"
                binary \"\#{appdir}/Secret Manager.app/Contents/MacOS/sec\", target: \"sec\"

                postflight do
                  system_command \"xattr\",
                                 args: [\"-cr\", \"\#{appdir}/Secret Manager.app\"]
                end

                livecheck do
                  url :url
                  strategy :github_latest
                end
              end
            CASK
          "

          cd /tmp/homebrew-tap
          git add Casks/secret-manager.rb
          git -c user.name="SecretManager Bot" -c user.email="bot@secretmanager.app" commit -m "Update secret-manager to v${VERSION}" || echo "No changes to commit"
          git push

