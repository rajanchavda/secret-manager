<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Metallic Edge Ring -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Biometric Cyan Glow -->
    <linearGradient id="touchIdGrad" x1="160" y1="140" x2="352" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Shield Vault Gradient -->
    <linearGradient id="shieldGrad" x1="256" y1="120" x2="256" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Keyhole Gold/Cyan Glow -->
    <linearGradient id="lockGrad" x1="220" y1="210" x2="292" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="16" y="24" width="480" height="480" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0369A1" flood-opacity="0.2"/>
    </filter>

    <filter id="glow" x="120" y="110" width="272" height="292" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle Container with Shadow -->
  <g filter="url(#shadow)">
    <!-- macOS Squircle (continuous curvature approximation) -->
    <rect x="40" y="40" width="432" height="432" rx="96" fill="url(#bgGrad)"/>
    <rect x="41" y="41" width="430" height="430" rx="95" stroke="url(#rimGrad)" stroke-width="2"/>
  </g>

  <!-- Subtle Top Glare / Lens Reflection -->
  <path d="M 64 64 C 180 50, 332 50, 448 64 C 440 160, 72 160, 64 64 Z" fill="white" fill-opacity="0.04"/>

  <!-- Shield Boundary Outline -->
  <path d="M 256 120 
           C 310 120, 350 142, 360 178
           C 360 264, 308 340, 256 384
           C 204 340, 152 264, 152 178
           C 162 142, 202 120, 256 120 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#touchIdGrad)" 
        stroke-width="3" 
        stroke-dasharray="6 4"
        stroke-opacity="0.45"/>

  <!-- Biometric Fingerprint Ridges -->
  <g filter="url(#glow)">
    <!-- Arc 1 (Outer Ridge) -->
    <path d="M 194 280 C 182 250, 184 210, 208 184 C 234 156, 278 156, 304 184 C 328 210, 330 250, 318 280" 
          stroke="url(#touchIdGrad)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85"/>

    <!-- Arc 2 (Middle Ridge) -->
    <path d="M 212 304 C 204 284, 204 236, 224 212 C 242 192, 270 192, 288 212 C 308 236, 308 284, 300 304" 
          stroke="url(#touchIdGrad)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.95"/>

    <!-- Arc 3 (Core Ridge) -->
    <path d="M 232 322 C 226 308, 226 264, 240 244 C 248 234, 264 234, 272 244 C 286 264, 286 308, 280 322" 
          stroke="url(#touchIdGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Central Ridge -->
    <path d="M 256 270 C 256 288, 256 332, 256 348" 
          stroke="url(#touchIdGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Outer Loop Right -->
    <path d="M 334 230 C 336 210, 330 186, 318 170" 
          stroke="url(#touchIdGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Outer Loop Left -->
    <path d="M 178 230 C 176 210, 182 186, 194 170" 
          stroke="url(#touchIdGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Center Vault Lock Shackle & Body Accent -->
  <g transform="translate(0, 10)">
    <!-- Shackle -->
    <path d="M 236 220 V 198 C 236 187, 245 178, 256 178 C 267 178, 276 187, 276 198 V 220" 
          stroke="url(#lockGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- Lock Body (Minimalist floating biometric keyhole) -->
    <rect x="224" y="218" width="64" height="48" rx="14" fill="#0F172A" stroke="url(#touchIdGrad)" stroke-width="3"/>
    
    <!-- Keyhole / Sensor circle -->
    <circle cx="256" cy="238" r="6" fill="#38BDF8"/>
    <path d="M 254 242 L 252 254 H 260 L 258 242 Z" fill="#38BDF8"/>
  </g>

  <!-- Subtle Apple Hardware Indicator Dot -->
  <circle cx="256" cy="428" r="3.5" fill="#38BDF8" opacity="0.8"/>
</svg>
